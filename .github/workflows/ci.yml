name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  # SHARDED ACROSS FOUR RUNNERS (#504), and the reason is that the obvious lever
  # does not work. The suite is 681 tests at ~11.6s each on CI (2.2h), against
  # ~3.4s each on a 12-core dev machine — `ubuntu-latest` is 2 vCPU with software
  # GL, so every WebGL scene renders on CPU. Raising `workers` was MEASURED and
  # gains only 1.41x (six specs: 20.3s serial vs 14.4s at --workers=6) because
  # total CPU is unchanged — one "serial" test already saturates ~5 cores, so
  # extra workers on one runner just timeshare the same silicon. More MACHINES
  # scale; more workers do not. `workers: 1` therefore stays as it is.
  e2e-shard:
    runs-on: ubuntu-latest
    strategy:
      # Every shard must report, or the merged total silently describes a subset.
      # The MIN_EXPECTED_TESTS floor in e2e-diff is what catches that, but there is
      # no reason to help it happen.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # LOAD-BEARING, and not visibly so — it looks like a leftover next to a dev
      # server. `acceptance.spec.ts`'s "#6b beacon endpoint absent in prod build"
      # greps dist/assets/*.js to prove the dev-only beacon middleware is excluded
      # from the bundle, and it calls `test.skip()` when dist/ is missing — so
      # dropping this step does not fail that test, it makes it VACUOUS. Playwright
      # decides which shard that spec lands in, so every shard builds. The shards
      # run in parallel, so this costs no wall clock over the single runner it
      # replaces.
      - run: npm run build
      # The suite is red on main and has been for a long time — headless-linux
      # rendering debt that passes on darwin. So this step's own pass/fail is
      # not the signal; let it run to completion and hand the verdict to
      # e2e-diff, which asks the question that actually decides a merge: does
      # this branch fail anything main does not? (#463 — and see the long
      # comment in scripts/e2e-diff.mjs for why this is a set difference and
      # not an allowlist someone reads.)
      - run: npx playwright test --shard=${{ matrix.shard }}/4 --reporter=blob
        continue-on-error: true
        env:
          # The census runs in e2e-census below; see there.
          E2E_SKIP_CENSUS: '1'
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shard }}
          path: blob-report/
          retention-days: 1

  # THE ANIMATABLE CENSUS, SPLIT BY SUBJECT INTO THREE PARALLEL JOBS (#1260). It is
  # one 597-row serial loop: 14–23 min on a dev machine (#1262), and CI ran two
  # other specs 2.6–4.6× slower than local, so inside a shard it would outlast
  # its own cap. A subject cannot be split (its instances must agree), and
  # SphereData alone is 226 rows — every compute kind drives its own Sphere — so
  # no part can be smaller than that. MEASURED 2026-09-26, locally, one part
  # after another: four parts took 4.0 / 2.4 / 2.9 / 4.5 min, three took
  # 1.7 / 3.7 / 4.0 min (226 / 186 / 185 rows). A fourth part did not shorten the
  # slowest one, so it would only add a runner. Rows are not time: a row whose
  # key moves nothing in the scene pays for two extra renders. Each part places
  # the whole scene and derives the same split, so the three check every subject
  # in src/app/animatableCensus.json between them. No build step: no census part
  # reads dist/. retries 0: a second attempt of a 45-min cap would double the
  # gate's wall time, and a rerun of the whole workflow is the flake policy.
  e2e-census:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        part: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/p1235-animatable-census.spec.ts --reporter=blob --retries=0
        continue-on-error: true
        env:
          CENSUS_PART: ${{ matrix.part }}/3
          # An unsharded run names its blob report.zip, so three of them would
          # overwrite each other when e2e merges the artifacts into one folder.
          PLAYWRIGHT_BLOB_OUTPUT_NAME: report-census-${{ matrix.part }}.zip
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blob-report-census-${{ matrix.part }}
          path: blob-report/
          retention-days: 1

  # NAMED `e2e` DELIBERATELY: that is the required status check on `main`, and a
  # matrix job would publish `e2e (1)`, `e2e (2)`, … so the context `e2e` would
  # never appear and every PR would block forever on a check that cannot exist.
  #
  # It also puts the required check on the job that actually decides the merge,
  # rather than on the one whose playwright step runs under continue-on-error and
  # whose pass/fail we are explicitly told to ignore.
  e2e:
    runs-on: ubuntu-latest
    needs: [e2e-shard, e2e-census]
    # always(), not success(): a shard job that dies on install or build must still
    # reach the verdict step, because a missing shard has to be caught by the
    # under-count floor rather than by this job never running.
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          merge-multiple: true
          path: all-blobs
      # ASSERT THE SHARD COUNT DIRECTLY, because the vacuous-run floor does NOT
      # cover this and it is not close. MEASURED: 681 tests over 4 shards is ~170
      # each, so losing one whole shard leaves 511 — comfortably above
      # MIN_EXPECTED_TESTS=500, which would then happily report "no new failures"
      # after running three quarters of the suite. A total is a proxy for "did the
      # suite run"; it is not a proxy for "did every shard report", so check the
      # thing itself.
      #
      # Seven: the four shards plus the three census parts (#1260).
      - name: every shard reported
        run: |
          found=$(find all-blobs -name '*.zip' | wc -l | tr -d ' ')
          echo "blob reports found: $found (expected 7)"
          if [ "$found" -ne 7 ]; then
            echo "::error::expected 7 blob reports (4 shards + 3 census parts), found $found — a job died or its upload failed. Refusing to render a verdict on a partial suite."
            exit 1
          fi
      # merge-reports emits exactly the shape e2e-diff already consumes: a
      # Playwright HTML report directory, whose index.html embeds the report as a
      # base64 zip. So the gate script needs no changes for sharding.
      - run: npx playwright merge-reports --reporter html ./all-blobs
        env:
          PLAYWRIGHT_HTML_OPEN: never
      - run: node scripts/e2e-diff.mjs check playwright-report
      # always(), not failure(): the report is the input to the next baseline
      # diff, so it has to survive a green run too.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

  license-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run license-audit
